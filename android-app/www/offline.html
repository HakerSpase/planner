<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нет сети</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#0a0a0c; color:#e8e8ee;
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing:border-box; text-align:center; }
  .dot { width:56px; height:56px; border-radius:50%; margin:0 auto 20px; background: radial-gradient(circle at 38% 32%, #7c5cff99, #7c5cff22 60%); box-shadow: 0 0 60px #7c5cff44; }
  h1 { font-size:20px; margin:0 0 6px; font-weight:600; }
  p { margin:0 0 22px; color:#9a9aa8; }
  button { height:44px; padding:0 22px; border:0; background:#7c5cff; color:#fff; font:inherit; font-weight:500; }
</style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Нет подключения</h1>
    <p>Planner откроется, как только появится интернет.</p>
    <button onclick="location.href='https://mplanner-dun.vercel.app/i'">Повторить</button>
  </main>
  <script>addEventListener('online', function () { location.href = 'https://mplanner-dun.vercel.app/i' })</script>
</body>
</html>
